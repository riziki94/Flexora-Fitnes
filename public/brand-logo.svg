<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A56DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: stylized F with motion lines -->
  <g transform="translate(30, 20)">
    <!-- Circle background -->
    <circle cx="50" cy="60" r="48" fill="url(#grad)" />
    <!-- Stylized F letterform -->
    <path d="M35 35 L35 85 M35 35 L68 35 M35 58 L60 58" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Motion arc -->
    <path d="M65 45 Q80 65 65 85" stroke="white" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M75 50 Q90 70 75 90" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3"/>
  </g>

  <!-- Text: Flexora -->
  <text x="140" y="75" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="800" fill="#1A56DB" letter-spacing="-1">Flexora</text>

  <!-- Text: Fitnes -->
  <text x="140" y="115" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="300" fill="#6B7280" letter-spacing="4">FITNES</text>

  <!-- Tagline -->
  <text x="140" y="145" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#9CA3AF" letter-spacing="2">GLOBAL PT MARKETPLACE</text>
</svg>
